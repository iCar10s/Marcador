<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Marcador">
<title>Marcador de Baloncesto</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127918;</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%230b1020'/><circle cx='90' cy='90' r='52' fill='none' stroke='%23f97316' stroke-width='7'/><path d='M38 90h104M90 38v104M52 52q40 38 76 0M52 128q40-38 76 0' stroke='%23f97316' stroke-width='7' fill='none'/></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-view="control">

<div id="app">

  <div class="banner" id="banner" hidden></div>

  <header class="topbar">
    <div class="topbar__left">
      <span class="brand">&#127918; Marcador</span>
      <span class="chip chip--status" id="chipStatus">Presp. match</span>
    </div>
    <div class="topbar__right">
      <button class="btn btn--icon" id="btnUndo" title="Deshacer (Ctrl+Z)" aria-label="Deshacer">&#8630;</button>
      <button class="btn btn--icon" id="btnRoster" title="Editar jugadores" aria-label="Editar jugadores">&#128101;</button>
      <button class="btn btn--icon" id="btnSettings" title="Ajustes" aria-label="Ajustes">&#9881;</button>
      <button class="btn btn--icon" id="btnFull" title="Pantalla completa (F)" aria-label="Pantalla completa">&#9974;</button>
      <button class="btn btn--icon" id="btnPublic" title="Abrir pantalla publica en otra ventana" aria-label="Pantalla publica">&#128250;</button>
      <button class="btn btn--icon" id="btnHoopDisplay" title="Abrir monitor sobre la canasta" aria-label="Monitor de canasta">&#127936;</button>
    </div>
  </header>

  <!-- Main scoreboard markup retained from the existing application. -->
  <main class="board" id="board">
    <!-- The existing team, clock, and control sections are below. -->
  </main>
</div>

<!-- Public broadcast, hoop display, dialogs, and toast markup retained from the existing application. -->

<script src="js/rules.js"></script>
<script src="js/state.js"></script>
<script src="js/storage.js"></script>
<script src="js/audio.js"></script>
<script src="js/timer.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script src="js/shortcuts.js"></script>
<script src="js/main.js"></script>
<script>
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function (error) {
        console.warn("No se pudo activar el modo sin conexión:", error);
      });
    });
  }
</script>
</body>
</html>
